<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>计步奖励播放系统</title>
    <style>
        :root {
            --primary: #4CAF50;
            --bg-color: #121212;
            --panel-bg: rgba(30, 30, 30, 0.9);
            --text-color: #ffffff;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 媒体播放区域 */
        #mediaContainer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        /* 底部隐藏状态栏 */
        #miniStatusBar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 10;
        }
        #miniStatusBar.show {
            opacity: 1;
        }
        #miniProgressBg {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
            border-radius: 2px;
            position: relative;
        }
        #miniProgressBar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 2px;
        }
        #miniPercent {
            font-size: 12px;
            margin-right: 10px;
            font-weight: bold;
            color: var(--primary);
            display: inline-block;
        }

        /* 百分比动画 */
        @keyframes percentPop {
            0% { transform: scale(1); color: var(--primary); }
            50% { transform: scale(1.5); color: #81C784; text-shadow: 0 0 8px #81C784; }
            100% { transform: scale(1); color: var(--primary); }
        }
        .pop-anim {
            animation: percentPop 0.4s ease-out;
        }

        /* 设置面板 */
        #settingsPanel {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
        }
        #settingsPanel.hidden {
            transform: translateY(100%);
        }

        /* 悬浮按钮 */
        #togglePanelBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 30;
            transition: transform 0.3s;
        }
        #togglePanelBtn.rotated {
            transform: rotate(180deg);
            background: #555;
            bottom: 30px;
        }

        /* 面板控件 */
        .control-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .control-group label {
            flex: 1;
            font-size: 14px;
        }
        input[type="range"] {
            flex: 2;
            accent-color: var(--primary);
        }
        input[type="number"] {
            width: 60px;
            margin-left: 10px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px;
            text-align: center;
        }
        input[type="file"] {
            width: 100%;
            margin-top: 5px;
            color: #ccc;
        }
        .btn-auth {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #stepCounterDisplay {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        /* 核心修复：防浏览器拦截的解锁遮罩层 */
        #unlockOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #4CAF50;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }
        #unlockOverlay.hidden {
            display: none;
        }
        #unlockOverlay span {
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 媒体容器 (加上了 preload="auto" 强制预加载元数据) -->
    <div id="mediaContainer">
        <video id="player" playsinline preload="auto"></video>
    </div>

    <!-- 极简底部状态栏 -->
    <div id="miniStatusBar">
        <div id="miniProgressBg">
            <div id="miniProgressBar"></div>
        </div>
        <div id="miniPercent">0%</div>
    </div>

    <!-- 自动播放解锁遮罩 (默认隐藏) -->
    <div id="unlockOverlay" class="hidden">
        ⚠️ 浏览器拦截了自动播放
        <span>（请随便点击屏幕任意位置，解除系统限制）</span>
    </div>

    <!-- 设置面板 -->
    <div id="settingsPanel">
        <div class="control-group">
            <label>步数统计: <span id="stepCounterDisplay">0</span> 步</label>
            <button class="btn-auth" id="authBtn">授权计步权限</button>
        </div>
        
        <div class="control-group">
            <label>上传媒体 (音/视频)</label>
            <input type="file" id="mediaUpload" accept="video/*,audio/*">
        </div>

        <div class="control-group">
            <label>播放进度</label>
            <input type="range" id="progressSlider" min="0" max="100" value="0" step="0.1">
            <span id="timeDisplay" style="margin-left: 10px; font-size: 12px; width: 80px; text-align: right;">00:00 / 00:00</span>
        </div>

        <div class="control-group">
            <label>播放速度</label>
            <input type="range" id="speedSlider" min="0.25" max="3" value="1" step="0.05">
            <input type="number" id="speedInput" min="0.25" max="3" value="1" step="0.05">
        </div>

        <div class="control-group">
            <label>音量大小</label>
            <input type="range" id="volumeSlider" min="0" max="1" value="1" step="0.01">
        </div>
    </div>

    <button id="togglePanelBtn">↓</button>

    <script>
        const player = document.getElementById('player');
        const mediaUpload = document.getElementById('mediaUpload');
        const progressSlider = document.getElementById('progressSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const speedSlider = document.getElementById('speedSlider');
        const speedInput = document.getElementById('speedInput');
        const volumeSlider = document.getElementById('volumeSlider');
        const settingsPanel = document.getElementById('settingsPanel');
        const togglePanelBtn = document.getElementById('togglePanelBtn');
        const miniStatusBar = document.getElementById('miniStatusBar');
        const miniProgressBar = document.getElementById('miniProgressBar');
        const miniPercent = document.getElementById('miniPercent');
        const authBtn = document.getElementById('authBtn');
        const stepCounterDisplay = document.getElementById('stepCounterDisplay');
        const unlockOverlay = document.getElementById('unlockOverlay');

        let isDraggingProgress = false;
        let lastPercentInt = -1;
        let stepCount = 0;
        let lastStepTime = 0;
        let playTimeout = null;
        let objectUrl = null;
        let playRejected = false; // 记录是否被浏览器拦截

        const STEP_THRESHOLD = 1.2;
        const STEP_COOLDOWN = 400;
        const PLAY_DURATION = 2000;

        // 格式化时间 (加入对 NaN 的判断，防止 00:00 BUG)
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // -------------------------
        // 1. 本地文件上传逻辑
        // -------------------------
        mediaUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (objectUrl) URL.revokeObjectURL(objectUrl);
            objectUrl = URL.createObjectURL(file);
            player.src = objectUrl;
            player.load(); // 触发加载
            
            stepCount = 0;
            stepCounterDisplay.textContent = stepCount;
            lastPercentInt = -1;
            miniPercent.textContent = "0%";
            miniProgressBar.style.width = "0%";
            progressSlider.value = 0;
        });

        // 【修复BUG】: 只要获取到了媒体的元数据，立刻更新总时长显示，解决全是 00:00 的问题
        player.addEventListener('loadedmetadata', () => {
            timeDisplay.textContent = `00:00 / ${formatTime(player.duration)}`;
        });

        // -------------------------
        // 2. 媒体控制逻辑
        // -------------------------
        player.addEventListener('timeupdate', () => {
            if (!player.duration || isNaN(player.duration)) return;
            
            const current = player.currentTime;
            const duration = player.duration;
            const percent = (current / duration) * 100;
            
            if (!isDraggingProgress) {
                progressSlider.value = percent;
                timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
            }

            miniProgressBar.style.width = `${percent}%`;
            
            const currentPercentInt = Math.floor(percent);
            if (currentPercentInt > lastPercentInt && currentPercentInt > 0) {
                miniPercent.textContent = `${currentPercentInt}%`;
                triggerPercentAnimation();
                lastPercentInt = currentPercentInt;
            }
        });

        progressSlider.addEventListener('mousedown', () => isDraggingProgress = true);
        progressSlider.addEventListener('touchstart', () => isDraggingProgress = true, {passive: true});
        
        progressSlider.addEventListener('input', () => {
            if (player.duration && !isNaN(player.duration)) {
                const targetTime = (progressSlider.value / 100) * player.duration;
                timeDisplay.textContent = `${formatTime(targetTime)} / ${formatTime(player.duration)}`;
            }
        });

        const updatePlayerTime = () => {
            if (player.duration && !isNaN(player.duration)) {
                player.currentTime = (progressSlider.value / 100) * player.duration;
            }
            isDraggingProgress = false;
        };
        progressSlider.addEventListener('mouseup', updatePlayerTime);
        progressSlider.addEventListener('touchend', updatePlayerTime);

        speedSlider.addEventListener('input', (e) => {
            player.playbackRate = parseFloat(e.target.value);
            speedInput.value = e.target.value;
        });
        speedInput.addEventListener('input', (e) => {
            let speed = parseFloat(e.target.value);
            if (isNaN(speed)) return;
            if (speed < 0.25) speed = 0.25;
            if (speed > 3) speed = 3;
            player.playbackRate = speed;
            speedSlider.value = speed;
        });

        volumeSlider.addEventListener('input', (e) => { player.volume = e.target.value; });

        togglePanelBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('hidden');
            if (settingsPanel.classList.contains('hidden')) {
                togglePanelBtn.textContent = '↑';
                togglePanelBtn.classList.add('rotated');
                miniStatusBar.classList.add('show');
            } else {
                togglePanelBtn.textContent = '↓';
                togglePanelBtn.classList.remove('rotated');
                miniStatusBar.classList.remove('show');
            }
        });

        function triggerPercentAnimation() {
            miniPercent.classList.remove('pop-anim');
            void miniPercent.offsetWidth; 
            miniPercent.classList.add('pop-anim');
        }

        // -------------------------
        // 3. 计步器与自动播放解锁系统
        // -------------------------
        function handleStepDetected() {
            stepCount++;
            stepCounterDisplay.textContent = stepCount;
            
            if (player.src && player.paused) {
                // 尝试播放
                let playPromise = player.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        // 【修复BUG】: 捕获浏览器拦截事件，并弹出遮罩层让用户点击
                        if (!playRejected) {
                            playRejected = true;
                            unlockOverlay.classList.remove('hidden');
                        }
                    });
                }
            }

            clearTimeout(playTimeout);
            playTimeout = setTimeout(() => {
                player.pause();
            }, PLAY_DURATION);
        }

        // 【修复BUG】: 当用户点击全屏遮罩层时，系统会认可这是一次"人类操作"，自动解除限制
        unlockOverlay.addEventListener('click', () => {
            unlockOverlay.classList.add('hidden');
            if (player.src) {
                player.play().then(() => {
                    player.pause(); // 马上暂停，等下一步继续走的时候播放
                    playRejected = false;
                }).catch(console.error);
            }
        });

        function handleMotion(event) {
            let acc = event.accelerationIncludingGravity;
            if (!acc || acc.x === null) return;

            let magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
            let delta = Math.abs(magnitude - 9.8);

            if (delta > STEP_THRESHOLD) {
                let now = Date.now();
                if (now - lastStepTime > STEP_COOLDOWN) {
                    lastStepTime = now;
                    handleStepDetected();
                }
            }
        }

        authBtn.addEventListener('click', () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            authBtn.textContent = "已授权计步";
                            authBtn.style.background = "var(--primary)";
                        } else {
                            alert("计步权限被拒绝！请在系统设置中允许。");
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
                authBtn.textContent = "已开启计步";
                authBtn.style.background = "var(--primary)";
            }
        });
    </script>
</body>
</html>
